# Log4Qt configuration
# Root logger
log4j.rootLogger=DEBUG, fileAppender

# File appender with daily rolling
log4j.appender.fileAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.fileAppender.file=logs/application.log
log4j.appender.fileAppender.datePattern='.'yyyyMMdd
log4j.appender.fileAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.fileAppender.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%p] %m%n

# Console appender (optional, for debugging)
log4j.appender.consoleAppender=org.apache.log4j.ConsoleAppender
log4j.appender.consoleAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.consoleAppender.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%p] %m%n
